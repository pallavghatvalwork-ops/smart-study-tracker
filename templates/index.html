<!DOCTYPE html>
<html>

<head>
    <title>Smart Study Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">
        <div style="text-align: right; margin-bottom: 10px;">
            <span>Welcome, {{ username }}!</span> | <a href="/logout">Logout</a>
        </div>

        <h1>📚 Study Tracker</h1>

        <input type="text" id="subject" placeholder="Enter subject">

        <br>

        <button class="start" onclick="startSession()">Start</button>
        <button class="stop" onclick="stopSession()">Stop</button>

        <h3 id="status"></h3>

        <section class="analytics">
            <h2>Study Analytics</h2>
            <div class="analytics-grid">
                <div class="card">
                    <p>Total Study Time</p>
                    <h3><span id="total">0</span> sec</h3>
                </div>
                <div class="card">
                    <p>Number of Sessions</p>
                    <h3 id="sessionCount">0</h3>
                </div>
                <div class="card">
                    <p>Average Session Duration</p>
                    <h3><span id="avgDuration">0</span> sec</h3>
                </div>
            </div>

            <h3>Subject-wise Study Time</h3>
            <ul id="subjectWiseList"></ul>
        </section>

        <h3>Sessions</h3>
        <ul id="sessionList"></ul>
    </div>

    <script src="/static/script.js"></script>

</body>

</html>
