<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Study Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="auth-page">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <button class="ghost auth-theme-toggle" id="authThemeToggle" type="button" aria-label="Toggle theme">Light Mode</button>

    <main class="auth-shell">
        <section class="auth-card glass">
            <p class="eyebrow">Get Started</p>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Build a smarter, consistent study routine.</p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="/register" class="auth-form">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="Choose a username" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Choose a password" required>

                <button type="submit" class="start auth-submit">Register</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="/login">Login here</a></p>
        </section>
    </main>

    <script src="/static/theme.js"></script>

</body>

</html>
